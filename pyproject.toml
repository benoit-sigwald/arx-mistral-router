[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arx-mistral-router"
version = "1.0.0"
description = "Fast, lightweight MCP delegation service routing tasks to Mistral AI free-tier models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Benoit Sigwald", email = "benoit@arx-consulting.com" }]
dependencies = [
    "mcp>=1.2.0",
    "fastmcp>=0.4.0",
    "httpx>=0.27.0",
    "mistralai>=1.0.0",
    "pydantic>=2.7.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
